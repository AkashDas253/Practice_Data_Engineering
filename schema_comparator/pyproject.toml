[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "schema-comparator"
version = "0.1.0"
description = "Schema-aware tabular dataset comparison, schema drift detection, and CDC engine."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyarrow>=14.0.0",
    "duckdb>=0.9.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0"
]

[project.scripts]
schema-comparator = "schema_comparator.cli:main"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-v --cov=schema_comparator"
testpaths = ["tests"]
pythonpath = ["."]