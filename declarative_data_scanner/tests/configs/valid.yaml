scans:

  application_logs:

    source:
      type: file
      path: "./logs/application/*.log"

    discovery:
      type: glob

    reader:
      type: text

    parser:
      modules:

        - type: regex_matcher
          config:
            pattern: "(?P<level>\\S+) (?P<message>.*)"

        - type: timestamp_normalizer
          config:
            field: timestamp
            input_format: "%Y-%m-%dT%H:%M:%S"

    processing:
      modules:

        - type: filter
          config:
            field: level
            equals: ERROR

        - type: select
          config:
            fields:
              - timestamp
              - level
              - message

    output:
      type: duckdb
      config:
        path: "./data/logs.duckdb"
        table: application_errors

    state:
      enabled: true
      path: "./state/application_logs.json"


  audit_logs:

    source:
      type: file
      path: "./logs/audit/*.json"

    discovery:
      type: glob

    reader:
      type: text

    parser:
      modules:

        - type: json_decoder

        - type: extractor
          config:
            fields:
              timestamp: timestamp
              user_id: user.id
              action: action

    processing:
      modules:

        - type: deduplicate
          config:
            keys:
              - timestamp
              - user_id
              - action

    output:
      type: parquet
      config:
        path: "./data/audit.parquet"

    state:
      enabled: true
      path: "./state/audit_logs.json"
