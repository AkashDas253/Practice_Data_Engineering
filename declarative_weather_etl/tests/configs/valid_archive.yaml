version: "1.0"
database:
  engine: "duckdb"
  filepath: "./data/test_archive.duckdb"
  table_name: "test_observations"
execution:
  batch_size_days: 10
  export_csv_on_complete: true
  csv_output_path: "./exports/test_archive.csv"
time_window:
  start_date: "2023-01-01"
  end_date: "2023-01-02"
locations:
  - id: "loc_a"
    latitude: 40.7128
    longitude: -74.0060
requested_metrics:
  - "air_temp"
  - "humidity"